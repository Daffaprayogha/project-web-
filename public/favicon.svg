<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20c997"/>
      <stop offset="45%" stop-color="#198754"/>
      <stop offset="100%" stop-color="#0f5132"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Icon Badge -->
  <rect width="128" height="128" rx="30" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Banknote / Document sticking out of wallet -->
  <path d="M40 38 C40 34 43 31 47 31 L81 31 C85 31 88 34 88 38 L88 50 L40 50 Z" fill="#e8f5e9" opacity="0.9"/>
  <line x1="50" y1="39" x2="78" y2="39" stroke="#198754" stroke-width="3" stroke-linecap="round"/>

  <!-- Wallet Body -->
  <rect x="26" y="46" width="76" height="54" rx="12" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="28" y="48" width="72" height="50" rx="10" fill="#f8fafc"/>

  <!-- Horizontal Stripe on Wallet -->
  <path d="M26 62 L102 62" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Wallet Flap with Clasp -->
  <path d="M68 60 L97 60 C101.5 60 105 63.5 105 68 L105 78 C105 82.5 101.5 86 97 86 L68 86 C65 86 63 84 63 81 L63 65 C63 62 65 60 68 60 Z" fill="#198754" filter="url(#shadow)"/>
  
  <!-- Golden Clasp / Coin Button with K symbol -->
  <circle cx="89" cy="73" r="8" fill="url(#goldGrad)"/>
  <circle cx="89" cy="73" r="6" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Small Growth Arrow / Spark in Top Right -->
  <g transform="translate(86, 16)">
    <circle cx="16" cy="16" r="16" fill="url(#goldGrad)" filter="url(#shadow)"/>
    <path d="M11 21 L20 12 M20 12 L14 12 M20 12 L20 18" stroke="#146c43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

